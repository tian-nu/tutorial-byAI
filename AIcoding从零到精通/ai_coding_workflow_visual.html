<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI编程完整工作流 — 可视化演示</title>
<!-- 自包含单文件，无外部依赖，可离线运行 -->
<style>
:root {
  --bg: #ffffff; --text: #1a1a2e; --border: #e0e0e0;
  --card-bg: #f8f9fa; --highlight: #4a90d9; --highlight-bg: #e8f0fe;
  --success: #27ae60; --warning: #e67e22; --danger: #e74c3c;
  --shadow: rgba(0,0,0,0.08); --arrow: #aaa;
  --node-bg: #fff; --tag-bg: #f0f0f0; --tag-text: #666;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1a2e; --text: #e0e0e0; --border: #333;
    --card-bg: #252540; --highlight: #6db3f2; --highlight-bg: #2a2a4a;
    --shadow: rgba(0,0,0,0.3); --arrow: #555;
    --node-bg: #2a2a40; --tag-bg: #333; --tag-text: #aaa;
  }
}
body { font-family: -apple-system,'Segoe UI','Microsoft YaHei',sans-serif; background:var(--bg); color:var(--text); margin:0; padding:20px; line-height:1.6; }
.container { max-width:960px; margin:0 auto; }
h1 { font-size:1.5em; margin-bottom:4px; }
.subtitle { color:#888; font-size:0.9em; margin-bottom:24px; }
.controls { display:flex; gap:12px; margin:20px 0; flex-wrap:wrap; align-items:center; }
button { padding:10px 20px; border:1px solid var(--highlight); background:var(--highlight); color:#fff; border-radius:6px; cursor:pointer; font-size:0.95em; transition:all 0.2s; font-family:inherit; }
button:hover { opacity:0.85; }
button:disabled { opacity:0.4; cursor:not-allowed; }
button.reset { background:transparent; color:var(--text); border-color:var(--border); }
.progress { font-size:0.85em; color:#888; margin-left:12px; }

/* 工作流管道 */
.pipeline { display:flex; flex-wrap:wrap; gap:0; align-items:stretch; margin:20px 0; position:relative; }
.pipeline.six-col .step-node { flex:1 1 140px; min-width:120px; }

/* 步骤节点 */
.step-node { background:var(--node-bg); border:2px solid var(--border); border-radius:10px; padding:16px 12px; text-align:center; transition:all 0.4s ease; opacity:0.5; position:relative; }
.step-node.active { border-color:var(--highlight); box-shadow:0 0 0 3px var(--highlight-bg); opacity:1; transform:translateY(-4px); }
.step-node.completed { border-color:var(--success); opacity:0.85; background:color-mix(in srgb, var(--success) 5%, var(--node-bg)); }
.step-num { background:var(--highlight); color:#fff; border-radius:50%; width:28px; height:28px; display:inline-flex; align-items:center; justify-content:center; font-size:0.85em; margin-bottom:8px; }
.step-node.completed .step-num { background:var(--success); }
.step-name { font-weight:bold; font-size:1em; margin-bottom:4px; display:block; }
.step-en { font-size:0.8em; color:var(--tag-text); display:block; margin-bottom:8px; }

/* 分工标签 */
.tags { display:flex; flex-wrap:wrap; gap:4px; justify-content:center; margin-top:6px; }
.tag { font-size:0.72em; padding:2px 8px; border-radius:10px; background:var(--tag-bg); color:var(--tag-text); white-space:nowrap; }
.tag.ai { background:var(--highlight-bg); color:var(--highlight); }
.tag.human { background:#fef3e2; color:var(--warning); }

/* 详情面板 */
.detail-panel { background:var(--card-bg); border:1px solid var(--border); border-radius:10px; padding:20px; margin-top:20px; min-height:120px; transition:all 0.3s; }
.detail-title { font-weight:bold; font-size:1.1em; margin-bottom:10px; }
.detail-row { display:flex; gap:20px; margin-bottom:10px; flex-wrap:wrap; }
.detail-col { flex:1; min-width:200px; }
.detail-col h4 { margin:0 0 6px 0; font-size:0.9em; }
.detail-col ul { margin:0; padding-left:18px; font-size:0.9em; }
.detail-col ul li { margin-bottom:4px; }
.detail-col.ai-col h4 { color:var(--highlight); }
.detail-col.human-col h4 { color:var(--warning); }

/* 箭头 */
.arrow-sep { display:flex; align-items:center; color:var(--arrow); font-size:1.5em; padding:0 2px; flex-shrink:0; }
@media (max-width: 768px) {
  .pipeline { flex-direction:column; }
  .arrow-sep { transform:rotate(90deg); padding:4px 0; }
  .step-node { opacity:0.8; }
}

.footer { margin-top:40px; padding-top:16px; border-top:1px solid var(--border); font-size:0.8em; color:#888; }
.footer a { color:var(--highlight); }
</style>
</head>
<body>
<div class="container">
<h1>🔄 AI编程完整工作流：需求→设计→编码→测试→部署</h1>
<p class="subtitle">本可视化对应 <a href="../../AIcoding从零到精通/42-完整工作流.md" style="color:var(--highlight)">《42-完整工作流》</a> 步骤1-6</p>

<div class="controls">
  <button id="btnPlay" onclick="play()">▶ 逐步播放</button>
  <button id="btnReset" class="reset" onclick="reset()">↺ 重置</button>
  <button id="btnAll" class="reset" onclick="showAll()">📋 全部展开</button>
  <span class="progress" id="stepIndicator">步骤 0 / 6</span>
</div>

<!-- 工作流管道 -->
<div class="pipeline six-col" id="pipeline">
  <!-- 节点由JS动态生成 -->
</div>

<!-- 详情面板 -->
<div class="detail-panel" id="detailPanel">
  <p style="color:#888;">点击 <strong>▶ 逐步播放</strong> 开始，或点击 <strong>📋 全部展开</strong> 一次性查看所有步骤。</p>
</div>

<div class="footer">
  <p>数据来源：基于 <strong>ai_coding_outline.md v2</strong>（2026年修订）</p>
  <p>反向链接：<a href="../../AIcoding从零到精通/42-完整工作流.md">《42-完整工作流：需求→设计→编码→测试→部署》</a></p>
</div>
</div>

<script>
// 工作流步骤数据 — 节点文字与教程术语完全一致
const steps = [
  {
    num: 1, name: '需求', en: 'Requirement',
    ai: ['检查需求是否有遗漏', '补充技术细节', '把模糊需求变成具体功能点'],
    human: ['定义核心目标', '排序功能优先级', '拍板确认最终需求'],
    summary: '让AI帮你梳理需求，但只有你知道"你到底想要什么"。'
  },
  {
    num: 2, name: '设计', en: 'Design',
    ai: ['推荐技术栈并说明理由', '规划文件结构', '设计数据库表结构'],
    human: ['判断技术栈是否合适', '根据自身情况选择', '拍板最终设计方案'],
    summary: 'AI推荐方案，你拍板。如果不合适，告诉AI你的约束条件。'
  },
  {
    num: 3, name: '编码', en: 'Coding',
    ai: ['按设计生成每个文件的代码', '处理语法细节和API调用', '解释代码含义'],
    human: ['决定先写哪个文件', '检查代码逻辑', '运行代码验证'],
    summary: '一次只让AI写一个文件，写完就验证。铁律！'
  },
  {
    num: 4, name: '测试', en: 'Testing',
    ai: ['生成测试用例', '分析测试失败原因', '写自动化测试代码'],
    human: ['手工执行核心功能测试', '判断Bug严重程度', '确认测试覆盖需求'],
    summary: 'AI擅长写测试，但测试通过≠测试写对了。'
  },
  {
    num: 5, name: '调试', en: 'Debugging',
    ai: ['分析错误日志定位根因', '提出修复方案', '解释为什么出错'],
    human: ['把完整错误信息喂给AI', '判断修复方案是否合理', '验证修复后功能正常'],
    summary: '不要自己瞎猜。把完整错误信息复制给AI。'
  },
  {
    num: 6, name: '部署', en: 'Deployment',
    ai: ['生成部署配置文件', '写部署脚本', '检查部署配置'],
    human: ['注册云服务账号', '配置服务器信息', '执行部署确认运行'],
    summary: 'AI帮你写配置，但服务器密码绝对不能发给AI。'
  }
];

let currentStep = 0;

function buildPipeline() {
  const pipeline = document.getElementById('pipeline');
  pipeline.innerHTML = '';
  steps.forEach((s, i) => {
    if (i > 0) {
      const arrow = document.createElement('div');
      arrow.className = 'arrow-sep';
      arrow.textContent = '→';
      pipeline.appendChild(arrow);
    }
    const node = document.createElement('div');
    node.className = 'step-node';
    node.id = 'node' + i;
    node.onclick = () => jumpTo(i);
    node.innerHTML = `
      <span class="step-num">${s.num}</span>
      <span class="step-name">${s.name}</span>
      <span class="step-en">${s.en}</span>
      <div class="tags">
        <span class="tag ai">🤖 AI</span>
        <span class="tag human">👤 人</span>
      </div>`;
    pipeline.appendChild(node);
  });
}

function updateDetail(idx) {
  const s = steps[idx];
  const panel = document.getElementById('detailPanel');
  panel.innerHTML = `
    <div class="detail-title">步骤 ${s.num}：${s.name}（${s.en}）</div>
    <p style="margin-bottom:12px;font-style:italic;color:var(--tag-text);">💡 ${s.summary}</p>
    <div class="detail-row">
      <div class="detail-col ai-col">
        <h4>🤖 AI能帮你做什么</h4>
        <ul>${s.ai.map(x => '<li>' + x + '</li>').join('')}</ul>
      </div>
      <div class="detail-col human-col">
        <h4>👤 人必须做什么</h4>
        <ul>${s.human.map(x => '<li>' + x + '</li>').join('')}</ul>
      </div>
    </div>`;
}

function highlightStep(idx) {
  for (let i = 0; i < steps.length; i++) {
    const node = document.getElementById('node' + i);
    node.classList.remove('active', 'completed');
    if (i < idx) node.classList.add('completed');
    if (i === idx) node.classList.add('active');
  }
  if (idx >= 0 && idx < steps.length) {
    updateDetail(idx);
  }
  document.getElementById('stepIndicator').textContent = `步骤 ${idx + 1} / ${steps.length}`;
}

function play() {
  if (currentStep >= steps.length) {
    currentStep = 0;
  }
  highlightStep(currentStep);
  currentStep++;
  if (currentStep < steps.length) {
    document.getElementById('btnPlay').textContent = '▶ 下一步';
    document.getElementById('btnPlay').disabled = false;
  } else {
    document.getElementById('btnPlay').textContent = '✓ 播放完毕';
    document.getElementById('btnPlay').disabled = true;
  }
}

function jumpTo(idx) {
  currentStep = idx + 1;
  highlightStep(idx);
  if (currentStep >= steps.length) {
    document.getElementById('btnPlay').textContent = '✓ 播放完毕';
    document.getElementById('btnPlay').disabled = true;
  } else {
    document.getElementById('btnPlay').textContent = '▶ 下一步';
    document.getElementById('btnPlay').disabled = false;
  }
}

function reset() {
  currentStep = 0;
  for (let i = 0; i < steps.length; i++) {
    const node = document.getElementById('node' + i);
    node.classList.remove('active', 'completed');
  }
  document.getElementById('detailPanel').innerHTML = '<p style="color:#888;">点击 <strong>▶ 逐步播放</strong> 开始，或点击 <strong>📋 全部展开</strong> 一次性查看所有步骤。</p>';
  document.getElementById('stepIndicator').textContent = '步骤 0 / 6';
  document.getElementById('btnPlay').textContent = '▶ 逐步播放';
  document.getElementById('btnPlay').disabled = false;
}

function showAll() {
  currentStep = steps.length;
  for (let i = 0; i < steps.length; i++) {
    const node = document.getElementById('node' + i);
    node.classList.add('completed');
    node.classList.remove('active');
  }
  // 显示最后一个的详情
  const last = steps.length - 1;
  document.getElementById('node' + last).classList.add('active');
  updateDetail(last);
  document.getElementById('stepIndicator').textContent = `全部 ${steps.length} 步已展开`;
  document.getElementById('btnPlay').textContent = '✓ 已完成';
  document.getElementById('btnPlay').disabled = true;
}

// 初始化
buildPipeline();
// 初始状态：全部显示但无高亮
for (let i = 0; i < steps.length; i++) {
  document.getElementById('node' + i).style.opacity = '0.8';
}
</script>
</body>
</html>
